<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>sep</title></head><body><button onclick="copySep()">复制分隔符</button><div id="sep"><p style="text-align:left;margin:24px 0 0;"><span style="font-family:'Times New Roman',serif;font-size:96px;color:#111111;">01</span><span style="font-family:'Times New Roman',serif;font-size:96px;color:#a4461d;">/</span></p></div><script>async function copySep(){var el=document.getElementById('sep');try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([el.innerHTML],{type:'text/html'}),'text/plain':new Blob([el.innerText],{type:'text/plain'})})]);document.title='OK-sep';}catch(e){document.title='FAIL-sep:'+e;}}</script></body></html>
